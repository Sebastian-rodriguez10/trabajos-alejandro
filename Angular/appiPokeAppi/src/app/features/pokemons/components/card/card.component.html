<div class="card">

    <img
        [src]="pokemon.sprites.front_default"
        [alt]="pokemon.name">

    <h2>{{ pokemon.name }}</h2>

    <p>
        <strong>ID:</strong>
        {{ pokemon.id }}
    </p>

    <p>
        <strong>Peso:</strong>
        {{ pokemon.weight }}
    </p>

    <p>
        <strong>Altura:</strong>
        {{ pokemon.height }}
    </p>

    <p>
        <strong>Experiencia:</strong>
        {{ pokemon.base_experience }}
    </p>

</div>
