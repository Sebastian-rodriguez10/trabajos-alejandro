<div class="card">
  <div class="card-header">
    <h3>{{ user.name }}</h3>
    <span class="id">#{{ user.id }}</span>
  </div>

  <div class="card-body">
    <p>
      <strong>Usuario:</strong>
      {{ user.username }}
    </p>

    <p>
      <strong>Correo:</strong>
      {{ user.email }}
    </p>
  </div>

  <div class="card-footer">
    <button class="btn-ver-mas">
      Ver más
    </button>
  </div>
</div>
