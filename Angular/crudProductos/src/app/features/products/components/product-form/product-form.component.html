<div class="form-container">
    <h2 class="form-title">Crear Producto</h2>

    <form class="product-form">
        <h4 class="form-label">Nombre</h4>
        <input class="form-input" type="text" placeholder="Ingrese el nombre">

        <h4 class="form-label">Precio</h4>
        <input class="form-input" type="number" placeholder="Ingrese el precio">

        <button class="form-button" type="submit">
            Crear
        </button>
    </form>
</div>
