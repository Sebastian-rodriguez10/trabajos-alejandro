<div class="list-card">
  <h2>Lista de Productos</h2>

  <div *ngIf="productos.length === 0" class="empty-state">
    No hay productos para mostrar
  </div>

  <div *ngIf="productos.length > 0" class="products-grid">
    <app-product-card
      *ngFor="let p of productos"
      [product]="p"
    ></app-product-card>
  </div>
</div>
